<script>try { var _sk = JSON.parse(localStorage.getItem('tugotl.skin') || '""'); if (_sk) document.documentElement.setAttribute('data-skin', _sk); } catch (e) { /* 저장소 없음 */ }</script>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="mbar">
  <button type="button" class="mbar-btn" id="mnav" aria-label="메뉴와 투고처 열기" aria-controls="side" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span class="mbar-brand">투고틀</span>
  <button type="button" class="mbar-journal" id="mjour" aria-controls="side">투고처 고르기</button>
  <span class="mbar-dot" id="mdot" aria-hidden="true"></span>
</header>
<div class="scrim" id="scrim" hidden></div>
<div class="splash" id="splash" hidden aria-hidden="true"><b>투고틀</b><span>논문 양식 변환 · 오프라인</span><i></i><span id="splash-msg">엔진 준비 중…</span></div>
<div class="shell">
  <aside class="side" id="side" aria-label="투고처와 메뉴">
    <div class="brand"><span class="brand-name">투고틀</span><span class="brand-sub">논문 양식 변환 · 오프라인</span></div>
    <div class="side-sec">
      <div class="side-label" id="jsel-label">투고처 선택</div>
      <select id="jarea" class="jarea" aria-label="분야로 거르기"></select>
      <select id="jsel" aria-labelledby="jsel-label"></select>
      <div id="jmeta" class="side-meta"></div>
      <nav id="jsub" class="side-sub" aria-label="선택한 투고처"></nav>
    </div>
    <nav class="side-sec side-nav" id="nav" aria-label="주 메뉴">
      <div class="side-label">메뉴</div>
      <button data-view="convert" class="on"><span class="ico" aria-hidden="true">#</span>원고 변환</button>
      <button data-view="schedule"><span class="ico" aria-hidden="true">#</span>투고 일정</button>
      <button data-view="manage"><span class="ico" aria-hidden="true">#</span>학회 추가</button>
      <button data-view="help"><span class="ico" aria-hidden="true">?</span>사용법·도움말</button>
    </nav>
    <div class="side-foot">
      <div class="mast-status" id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status-text">엔진 준비 중…</span></div>
      <div class="skins" id="skins" role="radiogroup" aria-label="화면 스킨"><span class="sk-label">스킨</span><button type="button" class="sw sw-default" data-skin="" role="radio" aria-label="다크 스튜디오(기본)" title="다크 스튜디오(기본)"></button><button type="button" class="sw sw-paper" data-skin="paper" role="radio" aria-label="종이·서지" title="종이·서지"></button><button type="button" class="sw sw-mono" data-skin="mono" role="radio" aria-label="모노크롬 미니멀" title="모노크롬 미니멀"></button><button type="button" class="sw sw-navy" data-skin="navy" role="radio" aria-label="네이비·크림" title="네이비·크림"></button><button type="button" class="sw sw-type" data-skin="type" role="radio" aria-label="타이포 편집" title="타이포 편집"></button><button type="button" class="sw sw-slack" data-skin="slack" role="radio" aria-label="보라(슬랙식, 이전 기본)" title="보라(슬랙식, 이전 기본)"></button><button type="button" class="sw sw-violet" data-skin="violet" role="radio" aria-label="바이올렛" title="바이올렛"></button></div>

      <div class="side-fine">원고는 이 브라우저 안에서만 처리되며 전송되지 않습니다 · <a href="https://github.com/edwardkim/rhwp" target="_blank" rel="noopener">rhwp</a> · v1.4 · 빌드 __BUILD__</div>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
